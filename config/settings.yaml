# One title + abstract produces one dense vector. No chunking at this stage.
embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  dimensions: 384
  device: cpu
  batch_size: 32
  cpu_threads: 4
  seed: 42
  normalize: true
  cache_folder: .cache/huggingface

# Dashboard defaults. HNSW experiments are temporary and preserve the exact stores.
lab_ui:
  top_k: 5
  hnsw:
    m: 16
    ef_construction: 100
    ef_search: 64
